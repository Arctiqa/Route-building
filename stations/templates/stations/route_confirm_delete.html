{% extends 'stations/base.html' %}

{% block title %}Удалить маршрут?{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-danger-subtle shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle display-4 text-danger"></i>
                <h1 class="h4 mt-3 mb-2">Удалить маршрут?</h1>
                <p class="text-muted mb-4">
                    {% if object.name %}<strong>{{ object.name }}</strong><br>{% endif %}
                    {{ object.start_point }} → {{ object.end_point }}<br>
                    <span class="small">Это действие необратимо.</span>
                </p>
                <form method="post" class="d-inline-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>Удалить
                    </button>
                    <a href="{% url 'stations:route-list' %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
